_format_version: "2.1"
_transform: true

services:
  - name: specs-combiner
    url: http://specs-combiner:9000
    routes:
      - name: specs-combiner-route
        paths:
          - /specs-combiner
        strip_path: true

  - name: user-service
    url: http://user:8007
    routes:
      - name: user-service-route
        paths:
          - /user-service
        strip_path: true

  - name: product-service
    url: http://product:8002
    routes:
      - name: product-service-route
        paths:
          - /product-service
        strip_path: true

  - name: order-service
    url: http://order:8003
    routes:
      - name: order-service-route
        paths:
          - /order-service
        strip_path: true

  - name: notification-service
    url: http://notification:8004
    routes:
      - name: notification-service-route
        paths:
          - /notification-service
        strip_path: true

  - name: inventory-service
    url: http://inventory:8005
    routes:
      - name: inventory-service-route
        paths:
          - /inventory-service
        strip_path: true

  - name: payment-service
    url: http://payment:8006
    routes:
      - name: payment-service-route
        paths:
          - /payment-service
        strip_path: true

# Applied to every route: protects the services from floods.
plugins:
  - name: rate-limiting
    config:
      minute: 120
      policy: local
