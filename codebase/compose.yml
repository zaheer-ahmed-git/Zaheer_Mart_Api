# version: "3.8"
# name: zaheercomposefile

services:
  # Microservices
  user-service:
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres-user:5432/userdb"
    container_name: "user"
    hostname: "user"
    build:
      context: ./UserServices
      dockerfile: Dockerfile.dev
    volumes:
      - ./UserServices:/code
    depends_on:
      postgres-user:
        condition: service_healthy
      broker:
        condition: service_healthy
    image: zaheer771/user-service:latest
    ports:
      - "8007:8007"
    networks:
      - backend
      - martapi-net

  product-service:
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres-product:5432/productdb"
    container_name: "product"
    hostname: "product"
    build:
      context: ./ProductServices
      dockerfile: Dockerfile.dev
    volumes:
      - ./ProductServices:/code
    depends_on:
      postgres-product:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - "8002:8002"
    image: zaheer771/product-service:latest

    networks:
      - backend
      - martapi-net

  order-service:
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres-order:5432/orderdb"
    container_name: "order"
    hostname: "order"
    build:
      context: ./OrderServices
      dockerfile: Dockerfile.dev
    volumes:
      - ./OrderServices:/code
    depends_on:
      postgres-order:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - "8003:8003"
    image: zaheer771/order-service:latest
    networks:
      - backend
      - martapi-net

  notification-service:
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres-notification:5432/notificationdb"
    container_name: "notification"
    hostname: "notification"
    build:
      context: ./NotificationServices
      dockerfile: Dockerfile.dev
    volumes:
      - ./NotificationServices:/code
    depends_on:
      postgres-notification:
        condition: service_healthy
      broker:
        condition: service_healthy
    image: zaheer771/notification-service:latest
    ports:
      - "8004:8004"
    networks:
      - backend
      - martapi-net

  inventory-service:
    env_file: .env
    environment:
      # own consumer group: sharing 'g-product' with product-service would split the messages
      KAFKA_CONSUMER_GROUP_ID_FOR_PRODUCT: g-inventory-product
      DATABASE_URL: "postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres-inventory:5432/inventorydb"
    container_name: "inventory"
    hostname: "inventory"
    build:
      context: ./InventoryServices
      dockerfile: Dockerfile.dev
    volumes:
      - ./InventoryServices:/code
    image: zaheer771/inventory-service:latest
    depends_on:
      postgres-inventory:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - "8005:8005"
    networks:
      - backend
      - martapi-net

  payment-service:
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres-payment:5432/paymentdb"
    container_name: "payment"
    hostname: "payment"
    build:
      context: ./PaymentServices
      dockerfile: Dockerfile.dev
    volumes:
      - ./PaymentServices:/code
    depends_on:
      postgres-payment:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - "8006:8006"
    networks:
      - backend
      - martapi-net
    image: zaheer771/payment-service:latest

  # pgadmin
  #   image: dpage/pgadmin4:8.6
  #   restart: always
  #   container_name: PgAdmin4Cont4
  #   ports:
  #     - "8880:80"
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=user@domain.com
  #     - PGADMIN_DEFAULT_PASSWORD=SuperSecret
  #   volumes:
  #     - pgadmin:/var/lib/pgadmin

  # Databases
  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-user:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  postgres-product:
    image: postgres:16-alpine
    container_name: postgres-product
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-product:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres-order:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  postgres-inventory:
    image: postgres:16-alpine
    container_name: postgres-inventory
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres-inventory:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  postgres-payment:
    image: postgres:16-alpine
    container_name: postgres-payment
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres-payment:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  postgres-notification:
    image: postgres:16-alpine
    container_name: postgres-notification
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres-notification:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # Message Broker
  broker:
    image: apache/kafka:3.7.0
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - backend

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "Local Kafka Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker:19092"
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - backend

  # Kong API Gateway
  # kong:
  #   image: kong:latest
  #   container_name: kong
  #   environment:
  #     KONG_DATABASE: "off"
  #     KONG_PROXY_ACCESS_LOG: /dev/stdout
  #     KONG_ADMIN_ACCESS_LOG: /dev/stdout
  #     KONG_PROXY_ERROR_LOG: /dev/stderr
  #     KONG_ADMIN_ERROR_LOG: /dev/stderr
  #     KONG_ADMIN_LISTEN: 0.0.0.0:8001
  #   ports:
  #     - "8008:8000"
  #     - "8009:8001"
  #   networks:
  #     - backend

volumes:
  postgres-user:
    driver: local
  postgres-product:
    driver: local
  postgres-order:
    driver: local
  postgres-inventory:
    driver: local
  postgres-payment:
    driver: local
  postgres-notification:
    driver: local

networks:
  backend:
    driver: bridge
  martapi-net:
    name: martapi-net
    driver: bridge
