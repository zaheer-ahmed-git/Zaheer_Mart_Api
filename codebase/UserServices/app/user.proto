syntax = "proto3";

package user;

enum SelectOption {
    GET = 0;
    GET_ALL = 1;
    ADD = 2;
    REGISTER = 3;
    LOGIN = 4;
    CURRENT_USER = 5;
    REFRESH_TOKEN = 6;
    CREATE = 7;
    UPDATE = 8;
    REDUCE = 9;
    DELETE = 10;
    PAYMENT_DONE = 11;
    CHECK = 12;
    CHECK_BY_PRODUCT = 13;
}

enum SelectService{
    PAYMENT = 0;
    ORDER = 1;
}

message User {
    int32 id =1;
    string user_id=2;
    string username =3;
    string email=4;
    string password =5;
    string access_token = 6;
    string refresh_token = 7;
    SelectService service = 8;
    string error_message = 9;
    SelectOption option =10;
    int64 http_status_code = 11;
    string shipping_address = 12;
    int64 phone = 13;
    string correlation_id = 14;
}


message UserList {
    repeated User users = 1;
}